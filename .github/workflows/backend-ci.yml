name: Backend CI

on:
  push:
    branches: [main, clean-main]
  pull_request:
    branches: [main, clean-main]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: |
          python -m compileall \
            jarvis.py \
            pipeline.py \
            intelligence_engine \
            ig_outreach \
            fb_outreach \
            forge_system/forge_system \
            -q

      - name: Smoke import FastAPI app
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_KEY: ci-service-key
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
          GEMINI_API_KEY: ci-gemini-key
        run: |
          cd forge_system/forge_system
          python - <<'PY'
          from main import app
          assert app.title == 'FORGE Intelligence System'
          print(app.title)
          PY

      - name: Build Docker image
        run: docker build . -t ai-os-backend:ci
